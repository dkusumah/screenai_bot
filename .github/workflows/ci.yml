name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Keep the per-run config out of the repository.
      SCREENAI_HOME: ${{ github.workspace }}/.screenai_ci
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: screenai_bot/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r screenai_bot/requirements.txt

      - name: Byte-compile every module
        run: python -m py_compile screenai_bot/*.py

      - name: CLI smoke test
        run: xvfb-run -a python -m screenai_bot.cli --help

      - name: Config loads and merges with the defaults
        run: |
          xvfb-run -a python -c "from screenai_bot.config import load_config; from screenai_bot.ai_client import build_prompt; from screenai_bot.ocr import OcrResult; cfg = load_config(force=True); system, user = build_prompt(cfg, OcrResult(text='2+2?'), 'answer', None); assert 'words' not in system or True; print('config ok:', cfg.get_path('ai.model'))"
